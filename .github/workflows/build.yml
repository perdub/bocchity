name: Build Bocchity

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bocchity-latest-release
  cancel-in-progress: false

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build JAR
        run: gradle clean build --no-daemon

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'bocchity-*.jar' ! -name '*-sources.jar' | sort | head -n 1)"
          test -n "$jar_path"
          test -s "$jar_path"
          echo "Built: $jar_path"
          jar tf "$jar_path" >/dev/null
          test "$(jar tf "$jar_path" | grep -c '^fabric.mod.json$')" -eq 1
          test "$(jar tf "$jar_path" | grep -c '^rocks/nijika/bocchity/BocchityMod.class$')" -eq 1

      - name: Prepare downloadable JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'bocchity-*.jar' ! -name '*-sources.jar' | sort | head -n 1)"
          cp "$jar_path" bocchity.jar
          test -s bocchity.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: bocchity-jar
          path: bocchity.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest bocchity.jar \
            --title "Bocchity latest build" \
            --notes "Automatic build from commit $GITHUB_SHA." \
            --prerelease \
            --target "$GITHUB_SHA"
