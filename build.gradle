import groovy.json.JsonOutput
import java.awt.image.BufferedImage

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.nucleoid.xyz/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation include("eu.pb4:polymer-core:${project.polymer_version}")
    modImplementation include("eu.pb4:polymer-blocks:${project.polymer_version}")
    modImplementation include("eu.pb4:polymer-resource-pack:${project.polymer_version}")
}

// -----------------------------------------------------------------------------
// Build-time image -> custom block compiler
// -----------------------------------------------------------------------------
// Put PNG/JPG/JPEG files in images/.
// For every image this task generates:
//   - a real registered Minecraft block + BlockItem
//   - a cube_all block model (same image on all 6 faces)
//   - blockstate + item model + translation
//   - the original image as the block texture
//   - Java registration source containing the exact set of blocks
//
// Nothing scans the images/ directory at runtime. The image is an ordinary
// asset inside the finished JAR.

def imageDir = file('images')
def generatedResourcesDir = layout.buildDirectory.dir('generated/bocchity-resources')
def generatedSourcesDir = layout.buildDirectory.dir('generated/bocchity-sources')

tasks.register('generateBocchity') {
    inputs.dir(imageDir)
    outputs.dir(generatedResourcesDir)
    outputs.dir(generatedSourcesDir)

    doLast {
        File outResources = generatedResourcesDir.get().asFile
        File outSources = generatedSourcesDir.get().asFile
        project.delete(outResources)
        project.delete(outSources)

        File assets = new File(outResources, 'assets/bocchity')
        File blockstates = new File(assets, 'blockstates')
        File blockModels = new File(assets, 'models/block')
        File itemModels = new File(assets, 'models/item')
        File lootTables = new File(outResources, 'data/bocchity/loot_table/blocks')
        File textures = new File(assets, 'textures/block')
        File lang = new File(assets, 'lang')
        File javaDir = new File(outSources, 'rocks/nijika/bocchity')

        [blockstates, blockModels, itemModels, textures, lang, lootTables, javaDir].each { it.mkdirs() }

        List<Map<String, String>> images = []
        imageDir.eachFile { File input ->
            if (!input.isFile()) return
            String lower = input.name.toLowerCase(Locale.ROOT)
            if (!(lower.endsWith('.png') || lower.endsWith('.jpg') || lower.endsWith('.jpeg'))) return

            String rawName = input.name.substring(0, input.name.lastIndexOf('.'))
            String id = rawName.toLowerCase(Locale.ROOT).replaceAll('[^a-z0-9_-]+', '_')
            id = id.replaceAll('_+', '_').replaceAll('^-+|_+$', '')
            if (!id) {
                id = 'image'
            }
            if (!id.matches('[a-z0-9][a-z0-9_-]*')) {
                id = 'image_' + id
            }
            if (images.any { it.id == id }) {
                throw new GradleException("Duplicate block id '${id}' generated by '${input.name}'.")
            }

            File textureFile = new File(textures, "${id}.png")
            BufferedImage bufferedImage
            if (lower.endsWith('.png')) {
                // Keep PNG input bytes untouched so the original texture is preserved.
                java.nio.file.Files.copy(input.toPath(), textureFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                bufferedImage = javax.imageio.ImageIO.read(textureFile)
                if (bufferedImage == null) {
                    throw new GradleException("Could not decode PNG image '${input.name}'.")
                }
            } else {
                // JPG/JPEG has no alpha channel and cannot be copied under a .png name.
                // Decode it and explicitly encode a real PNG for Minecraft.
                bufferedImage = javax.imageio.ImageIO.read(input)
                if (bufferedImage == null) {
                    throw new GradleException("Could not decode image '${input.name}'. Supported formats: PNG, JPG, JPEG.")
                }
                if (!javax.imageio.ImageIO.write(bufferedImage, 'png', textureFile)) {
                    throw new GradleException("Could not encode PNG texture for '${input.name}'.")
                }
            }

            // Detect actual alpha, not merely the presence of an alpha-capable PNG format.
            // Minecraft lighting is per block, so a transparent image block is made non-opaque
            // as a whole. Polymer TRANSPARENT_BLOCK is then used so alpha=0 pixels are cut out
            // visually, including when transparent image blocks are placed next to each other.
            boolean hasTransparency = false
            outer:
            for (int y = 0; y < bufferedImage.getHeight(); y++) {
                for (int x = 0; x < bufferedImage.getWidth(); x++) {
                    if (((bufferedImage.getRGB(x, y) >>> 24) & 0xFF) < 255) {
                        hasTransparency = true
                        break outer
                    }
                }
            }

            // cube_all means exactly the same texture is used on every face.
            new File(blockModels, "${id}.json").setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                    parent: 'minecraft:block/cube_all',
                    textures: [all: "bocchity:block/${id}"]
            ])), 'UTF-8')

            new File(blockstates, "${id}.json").setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                    variants: ['': [model: "bocchity:block/${id}"]]
            ])), 'UTF-8')

            // Block item uses the block model, so it shows as the textured cube.
            new File(itemModels, "${id}.json").setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                    parent: "bocchity:block/${id}"
            ])), 'UTF-8')

            new File(lootTables, "${id}.json").setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                    type: 'minecraft:block',
                    pools: [[
                            rolls: 1,
                            entries: [[type: 'minecraft:item', name: "bocchity:${id}"]],
                            conditions: [[condition: 'minecraft:survives_explosion']]
                    ]]
            ])), 'UTF-8')

            String displayName = rawName.replaceAll('[_-]+', ' ')
                    .replaceAll('([a-z])([A-Z])', '$1 $2')
                    .split(' ')*.trim()
                    .findAll { !it.isEmpty() }
                    .collect { it.substring(0, 1).toUpperCase(Locale.ROOT) + it.substring(1).toLowerCase(Locale.ROOT) }
                    .join(' ')

            images << [id: id, name: displayName ?: id, transparent: hasTransparency]
        }

        Map<String, String> translations = [:]
        images.each { image -> translations["block.bocchity.${image.id}"] = image.name }
        new File(lang, 'en_us.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson(translations)), 'UTF-8')

        StringBuilder source = new StringBuilder()
        source.append('package rocks.nijika.bocchity;\n\n')
        source.append('import net.fabricmc.fabric.api.itemgroup.v1.ItemGroupEvents;\n')
        source.append('import net.minecraft.block.AbstractBlock;\n')
        source.append('import net.minecraft.block.Block;\n')
        source.append('import net.minecraft.block.Blocks;\n')
        source.append('import net.minecraft.item.Item;\n')
        source.append('import net.minecraft.item.ItemGroups;\n')
        source.append('import net.minecraft.item.Items;\n')
        source.append('import net.minecraft.registry.Registries;\n')
        source.append('import net.minecraft.registry.Registry;\n')
        source.append('import net.minecraft.util.Identifier;\n')
        source.append('import java.util.ArrayList;\n')
        source.append('import java.util.List;\n')
        source.append('\n')
        source.append('public final class GeneratedBocchityBlocks {\n')
        source.append('    private static final List<Block> BLOCKS = new ArrayList<>();\n\n')
        source.append('    private GeneratedBocchityBlocks() {}\n\n')
        source.append('    public static void register() {\n')

        images.sort { a, b -> a.id <=> b.id }
        images.each { image ->
            String escaped = image.id.replace('\\', '\\\\').replace('"', '\\"')
            source.append('        registerImage("').append(escaped).append('", ').append(image.transparent ? 'true' : 'false').append(');\n')
        }

        source.append('    }\n\n')
        source.append('    private static void registerImage(String path, boolean transparent) {\n')
        source.append('        Identifier id = Identifier.of(BocchityMod.MOD_ID, path);\n')
        source.append('        ImageBlock block = Registry.register(Registries.BLOCK, id, new ImageBlock(\n')
        source.append('                AbstractBlock.Settings.copy(Blocks.WHITE_WOOL), id, transparent));\n')
        source.append('        Item item = Registry.register(Registries.ITEM, id, new ImageBlockItem(block, id));\n')
        source.append('        ItemGroupEvents.modifyEntriesEvent(ItemGroups.BUILDING_BLOCKS).register(entries -> entries.add(item));\n')
        source.append('        BLOCKS.add(block);\n')
        source.append('    }\n\n')
        source.append('    public static List<Block> all() {\n')
        source.append('        return List.copyOf(BLOCKS);\n')
        source.append('    }\n')
        source.append('}\n')

        new File(javaDir, 'GeneratedBocchityBlocks.java').setText(source.toString(), 'UTF-8')


        println("Bocchity: generated ${images.size()} custom block(s): ${images*.id}")
    }
}

tasks.register('verifyBocchityGeneration') {
    dependsOn(tasks.named('generateBocchity'))
    doLast {
        File outResources = generatedResourcesDir.get().asFile
        File assets = new File(outResources, 'assets/bocchity')
        File blockstates = new File(assets, 'blockstates')
        File blockModels = new File(assets, 'models/block')
        File itemModels = new File(assets, 'models/item')
        File lootTables = new File(outResources, 'data/bocchity/loot_table/blocks')
        File textures = new File(assets, 'textures/block')
        def parsed = imageDir.listFiles()
                ?.findAll { it.isFile() }
                ?.findAll { f ->
                    def lower = f.name.toLowerCase(Locale.ROOT)
                    lower.endsWith('.png') || lower.endsWith('.jpg') || lower.endsWith('.jpeg')
                } ?: []

        def ids = [] as Set
        def idFor = { File input ->
            def rawName = input.name.substring(0, input.name.lastIndexOf('.'))
            def id = rawName.toLowerCase(Locale.ROOT).replaceAll('[^a-z0-9_-]+', '_')
            id = id.replaceAll('_+', '_').replaceAll('^-+|_+$', '')
            if (!id) {
                id = 'image'
            }
            if (!id.matches('[a-z0-9][a-z0-9_-]*')) {
                id = 'image_' + id
            }
            id
        }

        parsed.each { File input ->
            def id = idFor(input)
            if (!ids.add(id)) throw new GradleException("Duplicate generated id '${id}'.")

            File texture = new File(textures, "${id}.png")
            File blockModel = new File(blockModels, "${id}.json")
            File blockState = new File(blockstates, "${id}.json")
            File itemModel = new File(itemModels, "${id}.json")
            File lootTable = new File(lootTables, "${id}.json")

            [texture, blockModel, blockState, itemModel, lootTable].each { f ->
                if (!f.isFile() || f.length() == 0) {
                    throw new GradleException("Missing generated file: ${f}")
                }
            }
            if (javax.imageio.ImageIO.read(texture) == null) {
                throw new GradleException("Generated texture is not a readable PNG: ${texture}")
            }

            def blockModelJson = new groovy.json.JsonSlurper().parse(blockModel)
            if (blockModelJson.parent != 'minecraft:block/cube_all' ||
                    blockModelJson.textures?.all != "bocchity:block/${id}") {
                throw new GradleException("Invalid cube_all model for '${id}'.")
            }
            def stateJson = new groovy.json.JsonSlurper().parse(blockState)
            if (stateJson.variants?['']?.model != "bocchity:block/${id}") {
                throw new GradleException("Invalid blockstate for '${id}'.")
            }
            def itemJson = new groovy.json.JsonSlurper().parse(itemModel)
            if (itemJson.parent != "bocchity:block/${id}") {
                throw new GradleException("Invalid item model for '${id}'.")
            }
            def lootJson = new groovy.json.JsonSlurper().parse(lootTable)
            if (lootJson.type != 'minecraft:block' ||
                    lootJson.pools?.size() != 1 ||
                    lootJson.pools[0]?.entries?.size() != 1 ||
                    lootJson.pools[0].entries[0]?.name != "bocchity:${id}") {
                throw new GradleException("Invalid block loot table for '${id}'.")
            }
        }

        println("Bocchity generation verified: ${parsed.size()} image(s), ${ids.size()} unique block id(s).")
    }
}

sourceSets {
    main {
        java.srcDir(generatedSourcesDir)
        resources.srcDir(generatedResourcesDir)
    }
}

tasks.named('compileJava') {
    dependsOn(tasks.named('verifyBocchityGeneration'))
}

tasks.named('processResources') {
    dependsOn(tasks.named('verifyBocchityGeneration'))
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

tasks.named('build') {
    dependsOn(tasks.named('verifyBocchityGeneration'))
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

// Gradle 8.x validates task dependencies strictly. The generated source/resource
// directories are consumed by sourcesJar, so make the relationship explicit.
tasks.named('sourcesJar') {
    dependsOn(tasks.named('generateBocchity'))
}
